# BetterLeaks / GitLeaks Configuration for KobeanAudio Workstation
# Ensures zero credentials or sensitive keys are leaked into source control.

title = "KobeanAudio Secret & Credential Detection Configuration"

[extend]
# Inherits standard gitleaks / betterleaks baseline rules

[allowlist]
description = "Global allowlist for build artifacts, locks, and placeholder configs"
paths = [
  '''^\.git/''',
  '''^\.next/''',
  '''^apps/web/\.next/''',
  '''^node_modules/''',
  '''^\.venv/''',
  '''^apps/api/\.venv/''',
  '''^audio_output/''',
  '''^apps/api/audio_output/''',
  '''^apps/desktop/src-tauri/target/''',
  '''^dist/''',
  '''^build/''',
  '''^\.env\.example$''',
  '''^pnpm-lock\.yaml$''',
  '''^Cargo\.lock$''',
]
stopwords = [
  "dummy_key",
  "placeholder",
  "your_gemini_api_key_here",
  "SAMPLE_KEY",
  "test_api_key",
]

[[rules]]
id = "google-gemini-api-key"
description = "Google Gemini AI Studio API Key"
regex = '''(?i)(gemini[_-]?api[_-]?key|google[_-]?api[_-]?key)["'\s:=]+(AIza[0-9A-Za-z-_]{35}|AQ\.[0-9A-Za-z-_]{40,})'''
entropy = 3.5
keywords = [
  "gemini",
  "google",
  "AIza",
]

[[rules]]
id = "openai-api-key"
description = "OpenAI Secret API Key"
regex = '''(?i)(openai[_-]?api[_-]?key|sk-[a-zA-Z0-9_-]{20,})'''
entropy = 3.5
keywords = [
  "openai",
  "sk-",
]

[[rules]]
id = "generic-api-key-strict"
description = "Generic High-Entropy API Key or Secret"
regex = '''(?i)(api[_-]?key|secret[_-]?key|auth[_-]?token|private[_-]?key)["'\s:=]+[0-9a-zA-Z\-_]{20,}'''
entropy = 4.0
keywords = [
  "api_key",
  "secret_key",
  "auth_token",
]
