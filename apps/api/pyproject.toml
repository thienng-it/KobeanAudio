[project]
name = "kobeanaudio-api"
version = "0.1.0"
description = "High-performance TTS backend for KobeanAudio"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "aiosqlite>=0.20.0",
    "python-multipart>=0.0.12",
    "pydub>=0.25.1",
    "audioop-lts>=0.2.0; python_version >= '3.13'",
    "soundfile>=0.12.1",
    "numpy>=1.26.0",
    "google-genai>=1.0.0",
    "httpx>=0.27.0",
    "sse-starlette>=2.1.0",
    "python-docx>=1.1.0",
    "pypdf>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors (PEP8)
    "W",   # pycodestyle warnings (PEP8)
    "F",   # Pyflakes
    "I",   # isort (PEP8 imports)
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line length handled by formatter
    "B008", # FastAPI Depends/File/Form defaults
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "db*", "domain*", "engines*"]

